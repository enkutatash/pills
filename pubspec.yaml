name: pills
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  go_router: ^14.6.2
  awesome_bottom_bar: ^1.2.4
  equatable: ^2.0.7
  firebase_storage: ^12.1.1
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  shared_preferences: ^2.3.4
  internet_connection_checker: ^3.0.1
  # just_audio: ^0.9.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.10.0  # Add this line for app icon customization

flutter:
  uses-material-design: true
  assets:
    - assets/  # This should only appear once

flutter_icons:  # Correct placement outside the flutter section
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"  # Path to your app icon image
